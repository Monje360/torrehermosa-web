<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Torrehermosa · Story · Descubre</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  .story-mosaic {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr 1fr;
    gap: 8px;
  }
  .story-mosaic div {
    background-size: cover;
    background-position: center;
  }
  .story-mosaic > :nth-child(1) { grid-column: 1 / 3; grid-row: 1; }      /* hero wide */
  .story-mosaic > :nth-child(2) { grid-column: 1; grid-row: 2; }
  .story-mosaic > :nth-child(3) { grid-column: 2; grid-row: 2; }
  .story-mosaic > :nth-child(4) { grid-column: 1 / 3; grid-row: 3; }      /* boda wide */
  .story-mosaic > :nth-child(5) { grid-column: 1; grid-row: 4; }
  .story-mosaic > :nth-child(6) { grid-column: 2; grid-row: 4; }
  .story-overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg,
        rgba(26,23,20,.55) 0%,
        rgba(26,23,20,.05) 18%,
        rgba(26,23,20,.05) 60%,
        rgba(26,23,20,.85) 88%,
        rgba(26,23,20,.95) 100%);
  }
  .story-titlebox {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: rgba(26,23,20,.88);
    border: 1px solid var(--gold);
    color: var(--cream);
    padding: 56px 48px;
    text-align: center;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    min-width: 720px;
  }
  .story-titlebox .eyebrow { color: var(--gold-soft); margin-bottom: 20px; }
  .story-titlebox h1 { color: var(--cream); }
  .story-titlebox em { color: var(--gold); }
</style>
</head>
<body>

<div class="tools">
  <a href="index.html" class="tools__link">← Volver al índice</a>
  <span class="tools__title">Story 2 · Descubre</span>
  <div class="tools__actions">
    <button id="download-all" class="tools__btn">↓ Descargar</button>
  </div>
</div>

<div class="carousel">

  <section class="slide slide--story slide--dark">
    <div class="story-mosaic">
      <div style="background-image:url('../img/suspiro-hero.jpg')"></div>
      <div style="background-image:url('../img/suspiro-frambuesa.jpg')"></div>
      <div style="background-image:url('../img/suspiro-cafe.jpg')"></div>
      <div style="background-image:url('../img/tarta-boda.jpg')"></div>
      <div style="background-image:url('../img/brioche-1.jpg')"></div>
      <div style="background-image:url('../img/roscon-reyes.jpg')"></div>
    </div>
    <div class="story-overlay"></div>

    <header class="slide__header" style="position:relative; z-index:3;">
      <img class="slide__logo" src="../img/logo.svg" alt="Torrehermosa" style="filter:brightness(0) invert(1);" />
      <span class="story__handle" style="margin:0; color:rgba(250,246,240,.7);">Story 2</span>
    </header>

    <div class="story-titlebox">
      <span class="eyebrow">— Lo que encontrarás —</span>
      <h1 class="h1" style="font-size:84px;">Nuestra<br/>carta<br/><em>al completo.</em></h1>
    </div>

    <footer class="slide__footer" style="position:relative; z-index:3;">
      <span class="story__handle" style="margin-top:0; color:rgba(250,246,240,.85);">
        @pasteleriatorrehermosa · Desde 1962
      </span>
    </footer>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
