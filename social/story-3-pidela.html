<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Torrehermosa · Story · Pídela</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="tools">
  <a href="index.html" class="tools__link">← Volver al índice</a>
  <span class="tools__title">Story 3 · Pídela</span>
  <div class="tools__actions">
    <button id="download-all" class="tools__btn">↓ Descargar</button>
  </div>
</div>

<div class="carousel">

  <section class="slide slide--story slide--photo slide--dark">
    <div class="slide__bg" style="background-image:url('../img/envio-domicilio.jpg')"></div>
    <div class="slide__veil" style="background:linear-gradient(180deg,rgba(26,23,20,.45) 0%,rgba(26,23,20,.15) 25%,rgba(26,23,20,.55) 55%,rgba(26,23,20,.92) 100%);"></div>
    <header class="slide__header">
      <img class="slide__logo" src="../img/logo.svg" alt="Torrehermosa" />
      <span class="slide__num">Story 3</span>
    </header>
    <main class="slide__body" style="justify-content:flex-end; padding-bottom:120px;">
      <span class="eyebrow">— Pedidos a domicilio —</span>
      <h1 class="display">Pídela<br/><em>en un click.</em></h1>
      <p class="lede" style="margin-top:32px; font-size:30px; max-width:28ch;">
        Te la llevamos a casa.<br/>Encarga desde la web.
      </p>
      <span class="story-arrow">Visita la web</span>
    </main>
    <footer class="slide__footer">
      <span class="story__url">pasteleriatorrehermosa.com</span>
      <span class="story__handle">WhatsApp · +34 636 216 585</span>
    </footer>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
