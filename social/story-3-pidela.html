<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Torrehermosa · Story · Pídela</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  .story-split {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: 1.1fr 1fr;
  }
  .story-split > div {
    background-size: cover;
    background-position: center;
  }
  .story-bottom-veil {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg,
        rgba(26,23,20,.0) 0%,
        rgba(26,23,20,.0) 38%,
        rgba(26,23,20,.55) 55%,
        rgba(26,23,20,.95) 82%,
        rgba(26,23,20,1) 100%);
  }
  .story-cta-block {
    position: absolute;
    left: 0; right: 0; bottom: 240px;
    padding: 0 80px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    z-index: 4;
  }
  .story-cta-block .eyebrow { color: var(--gold-soft); }
  .story-cta-block h1 { color: var(--cream); }
  .story-cta-block em { color: var(--gold); }
  .story-cta-block .lede { color: rgba(250, 246, 240, .9); font-size: 32px; max-width: 26ch; margin-top: 28px; }
  .wa-stamp {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    margin-top: 40px;
    padding: 18px 32px;
    background: #25D366;
    color: #ffffff;
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.02em;
    box-shadow: 0 20px 40px -10px rgba(37, 211, 102, .45);
  }
  .wa-stamp svg { width: 32px; height: 32px; }
</style>
</head>
<body>

<div class="tools">
  <a href="index.html" class="tools__link">← Volver al índice</a>
  <span class="tools__title">Story 3 · Pídela</span>
  <div class="tools__actions">
    <button id="download-all" class="tools__btn">↓ Descargar</button>
  </div>
</div>

<div class="carousel">

  <section class="slide slide--story slide--dark">
    <div class="story-split">
      <div style="background-image:url('../img/envio-domicilio.jpg')"></div>
      <div style="background-image:url('../img/suspiro-hero.jpg')"></div>
    </div>
    <div class="story-bottom-veil"></div>

    <header class="slide__header" style="position:relative; z-index:4;">
      <img class="slide__logo" src="../img/logo.svg" alt="Torrehermosa" style="filter:brightness(0) invert(1);" />
      <span class="medal" style="font-size:11px; padding:8px 16px; letter-spacing:0.18em;">★ Mejor tarta de Madrid</span>
    </header>

    <div class="story-cta-block">
      <span class="eyebrow">— Pedidos a domicilio —</span>
      <h1 class="display"><em>Pídela</em><br/>en un click.</h1>
      <p class="lede">
        Te la llevamos a casa.<br/>Encarga sin moverte.
      </p>
      <span class="wa-stamp">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9s-.5-.1-.7.1-.8.9-1 1.1-.4.2-.6.1c-.3-.1-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.4.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.2-.4.1-.2 0-.3 0-.4 0-.1-.7-1.7-.9-2.3-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1 2.8 1.2 3c.1.2 2.1 3.2 5 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.6 1.4 5.2L2 22l4.9-1.3c1.5.8 3.3 1.3 5.1 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
        Pedidos por WhatsApp
      </span>
    </div>

    <footer class="slide__footer" style="position:relative; z-index:4;">
      <span class="story__handle" style="margin-top:0;">@pasteleriatorrehermosa</span>
    </footer>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
