<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Torrehermosa · Story · Nueva web</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="tools">
  <a href="index.html" class="tools__link">← Volver al índice</a>
  <span class="tools__title">Story 1 · Nueva web</span>
  <div class="tools__actions">
    <button id="download-all" class="tools__btn">↓ Descargar</button>
  </div>
</div>

<div class="carousel">

  <section class="slide slide--story slide--photo slide--dark">
    <div class="slide__bg" style="background-image:url('../img/suspiro-hero.jpg'); background-position: center 35%; background-size: cover;"></div>
    <div class="slide__veil" style="background:linear-gradient(180deg,rgba(26,23,20,.7) 0%,rgba(26,23,20,.25) 30%,rgba(26,23,20,.35) 55%,rgba(26,23,20,.95) 100%);"></div>
    <header class="slide__header">
      <img class="slide__logo" src="../img/logo.svg" alt="Torrehermosa" />
      <span class="medal" style="font-size:11px; padding:8px 16px; letter-spacing:0.18em;">★ Desde 1962</span>
    </header>
    <main class="slide__body" style="justify-content:flex-end; padding-bottom:60px;">
      <span class="eyebrow">— Estrenamos web —</span>
      <h1 class="display"><em>Nueva</em><br/>web.</h1>
      <p class="lede" style="margin-top:36px; font-size:34px; max-width:22ch; color:rgba(250,246,240,.92);">
        Sesenta años de oficio,<br/>ahora también online.
      </p>
    </main>
    <footer class="slide__footer">
      <span class="story__handle" style="margin-top:0;">@pasteleriatorrehermosa</span>
    </footer>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
